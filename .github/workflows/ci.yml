name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Tests never touch an OS keychain (keys live in the xflow keystore).
  XFLOW_NO_KEYCHAIN: "1"

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libdbus-1-dev dbus-daemon
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/cli -> target
      - run: scripts/check.sh fmt
      - run: scripts/check.sh clippy
      # Runs on a private session bus, including the ignored D-Bus bridge test.
      - run: scripts/check.sh test

  scoreboard:
    name: scoreboard gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        id: rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo "version=$(rustc --version | tr -c 'A-Za-z0-9.\n' -)" >> "$GITHUB_OUTPUT"
      # The gate needs only these two release binaries. The same sources and toolchain
      # give byte-identical binaries, so a change outside apps/cli skips the build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: binaries
        with:
          path: target/scoreboard-bin
          key: scoreboard-bin-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('apps/cli/**') }}
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libdbus-1-dev dbus-daemon
      - if: steps.binaries.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/cli -> target
          key: release
      - if: steps.binaries.outputs.cache-hit != 'true'
        run: |
          cargo build --manifest-path apps/cli/Cargo.toml --release --locked -p xflow-app --bin xflowd --bin xflow
          mkdir -p target/scoreboard-bin
          cp apps/cli/target/release/xflowd apps/cli/target/release/xflow target/scoreboard-bin/
      # Sizes, idle PSS/CPU and startup budget against docs/benchmarks/ci-baseline.json.
      - run: >-
          python3 -B scripts/bench/scoreboard.py gate --daemon target/scoreboard-bin/xflowd
          --cli target/scoreboard-bin/xflow --output target/scoreboard-gate.json
      - if: always()
        run: python3 -B scripts/bench/test_scoreboard.py && python3 -B scripts/bench/test_baseline.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scoreboard-gate
          path: target/scoreboard-gate.json
          if-no-files-found: ignore

  macos:
    defaults:
      run:
        working-directory: apps/cli
    name: macOS clippy, test
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Short, predictable Unix socket paths for the daemon tests (SUN_LEN is 104 bytes).
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/cli -> target
      - run: cargo clippy --workspace --all-targets --locked --features xflow-app/test-support -- -D warnings
      - run: cargo test --workspace --locked --features xflow-app/test-support

  extension:
    name: GNOME extension
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin
      - run: node --version
      - run: scripts/check.sh extension

  msrv:
    defaults:
      run:
        working-directory: apps/cli
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libdbus-1-dev
      - name: Install workspace rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          rustup default "$msrv"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/cli -> target
      - run: cargo check --workspace --locked

  web-changes:
    name: web changed?
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/ci.yml'

  web:
    name: web lint, typecheck, test, build, axe
    needs: web-changes
    if: needs.web-changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # Public routes only: the account pages need Clerk secrets that CI doesn't have.
      - name: axe (light and dark)
        run: |
          bun run start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          bun scripts/axe.ts http://localhost:3000 / /pricing /download /compare/wispr-flow /docs /docs/getting-started/install /docs/reference/cli /changelog /privacy /terms /security /missing-page
