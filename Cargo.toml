[workspace]
members = ["crates/xflow-core", "crates/xflow-providers", "crates/xflow-platform", "crates/xflow-app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time", "process", "fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
