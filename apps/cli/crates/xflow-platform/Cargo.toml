[package]
name = "xflow-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["native-audio"]
native-audio = ["dep:cpal", "dep:coreaudio-rs"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
xflow-core = { path = "../xflow-core" }
cpal = { version = "0.15.3", optional = true }
zbus = { version = "4.4", default-features = false, features = ["tokio"] }
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
tempfile = "3"
# Already built for cpal (same version/features); used directly for voice processing.
coreaudio-rs = { version = "0.11", default-features = false, features = ["audio_unit", "core_audio"], optional = true }
