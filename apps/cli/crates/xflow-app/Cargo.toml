[package]
name = "xflow-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Explicit opt-in for isolated binary integration tests; never enabled in releases.
test-support = ["dep:hound"]

[[bin]]
name = "xflow"
path = "src/bin/xflow.rs"

[[bin]]
name = "xflowd"
path = "src/bin/xflowd.rs"

[dependencies]
xflow-core = { path = "../xflow-core" }
xflow-providers = { path = "../xflow-providers" }
xflow-platform = { path = "../xflow-platform" }
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tempfile = "3"
zeroize = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
toml = "0.8"
toml_edit = "0.22"
fs2 = "0.4"
libc = "0.2"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
rpassword = "7"
# Streams WAV fixtures into the daemon in test-support builds only.
hound = { version = "3.5", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-child-process"] }
