[package]
name = "xflow-providers"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xflow-core = { path = "../xflow-core" }
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64 = "0.22"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "multipart", "http2"] }
zeroize = "1"
hound = "3.5"
flacenc = { version = "0.5.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[dev-dependencies]
claxon = "0.4"
