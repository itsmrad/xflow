[workspace]
members = ["crates/xflow-core", "crates/xflow-providers", "crates/xflow-platform", "crates/xflow-app"]
resolver = "2"

[workspace.package]
version = "0.2.0-beta"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time", "process", "fs"] }

[profile.release]
# Fat LTO measured on M2: xflowd -14%, xflow -13%, 30 s resample 9.0 -> 7.0 ms; opt-level "s" was 4.5x slower.
lto = "fat"
codegen-units = 1
strip = true
# TUI terminal restoration needs stack unwinding.
panic = "unwind"
