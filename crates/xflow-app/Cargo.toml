[package]
name = "xflow-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "xflow"
path = "src/bin/xflow.rs"

[[bin]]
name = "xflowd"
path = "src/bin/xflowd.rs"

[dependencies]
xflow-core = { path = "../xflow-core" }
xflow-providers = { path = "../xflow-providers" }
xflow-platform = { path = "../xflow-platform" }
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tempfile = "3"
zeroize = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
toml_edit = "0.22"
tempfile = "3"
fs2 = "0.4"
libc = "0.2"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
rpassword = "7"

[dev-dependencies]
