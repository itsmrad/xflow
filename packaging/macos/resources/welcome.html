<h2>xflow</h2>
<p>Voice dictation for your Mac: hold <b>Fn</b>, speak, release, and your words are typed wherever your cursor is.</p>
<p>xflow runs as a tiny background worker (about 10 MB of memory) with no app window. Settings live in the Terminal: <code>xflow tui</code>.</p>
