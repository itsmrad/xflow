# .deb and .rpm from a release tarball. scripts/package-linux.sh stages ./root and sets ARCH and VERSION.
# Dependencies are the libraries the binaries link (readelf -d): libasound, libdbus-1, libgcc_s, glibc.
name: xflow
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: utils
priority: optional
maintainer: xflow contributors
vendor: xflow
homepage: https://github.com/itsmrad/xflow
license: MIT
description: |-
  Local-first voice typing for Linux desktops
  xflowd runs as a per-user systemd service; enable it with
  `systemctl --user enable --now xflow.service`, then run `xflow`.
recommends:
  - wl-clipboard
overrides:
  deb:
    depends:
      - libc6 (>= 2.39)
      - libgcc-s1
      - libasound2t64 | libasound2
      - libdbus-1-3
  rpm:
    depends:
      - glibc >= 2.39
      - libgcc
      - alsa-lib
      - dbus-libs
contents:
  - src: root/xflow
    dst: /usr/bin/xflow
    file_info: {mode: 0755}
  - src: root/xflowd
    dst: /usr/bin/xflowd
    file_info: {mode: 0755}
  - src: root/xflow.service
    dst: /usr/lib/systemd/user/xflow.service
    file_info: {mode: 0644}
  - src: root/doc/
    dst: /usr/share/doc/xflow/
    file_info: {mode: 0644}
  - src: root/doc/LICENSE
    dst: /usr/share/doc/xflow/copyright
    file_info: {mode: 0644}
    packager: deb
scripts:
  preremove: root/preremove.sh
