# xflow configuration. Edit here, with `xflow config set <key> <value>`, or in the TUI.
# Secrets are read from OS credential storage or environment variables, never this file.
# Overlay look is managed with `xflow overlay`; Linux shortcuts use GNOME settings.

[stt]
provider = "groq"            # `xflow providers` lists every provider
# model = "whisper-large-v3-turbo"   # `xflow models` lists models; unset = provider default
# endpoint = "https://api.groq.com/openai/v1/audio/transcriptions"   # full URL override
# protocol = "openai"        # wire protocol for provider = "custom"
# api_key_env = "GROQ_API_KEY"
# language = "en"            # ISO-639-1; unset = automatic detection
languages = []              # up to 3 languages you mix, e.g. ["hi", "en"]; instead of language; `xflow providers info` shows support
vocabulary = []              # extra recognition hints (dictionary.words are added too)
domain_hints = true          # also hint shipped terms picked for the focused app and your recent terms
timeout_secs = 30
fallback = []               # opt in: one backup id, e.g. ["openai"]; needs `xflow key set openai`
# Backup uses its catalog endpoint/model and stored key. Audio may go to both providers.
# On connect/TLS/upload/read errors, 408, 429, 5xx or timeout: try the other provider once.
# Batch attempts get min(timeout_secs, 3 + 0.25 * audio_seconds); async AssemblyAI gets timeout_secs.
# After primary failure, backup goes first for 60 s; any backup error probes the primary once.
# A missing backup key warns and runs primary-only; validate/save still require the key.
# No parallel or background retries.

[cleanup]
mode = "raw"                 # raw | light | polished | custom (custom requires prompt)
# provider = "groq"          # preset that fills endpoint/model/key defaults
# endpoint = "https://api.groq.com/openai/v1/chat/completions"
# model = "llama-3.1-8b-instant"
api_key_env = "OPENAI_API_KEY"
# prompt = "Keep my British spelling."
timeout_secs = 20
app_context = false          # opt in: tell the model the focused app id (never window contents)
rewrite_selection = false    # opt in (macOS): a short hold over selected text rewrites it; sends the selection to the cleanup provider (never terminals, search or password fields)

[hotkey]
key = "fn"                  # macOS Fn/Globe; see docs/hotkeys.md for allowed keys/chords
double_tap_ms = 500          # second press within this long after a quick tap's release latches hands-free
hold_threshold_ms = 500      # releases sooner than this are taps (Wispr Flow's defaults)
enabled = true

[recording]
max_seconds = 1200           # hard stop in seconds (at most 20 minutes)
silence_threshold = 0.005    # minimum 20 ms frame RMS; speech must last at least 80 ms
# device = "USB Microphone"  # exact name from `xflow devices`; missing names fall back on macOS
# macOS: use built-in input when the default is Bluetooth; named devices override.
# Virtual/aggregate defaults also fall back to built-in. No built-in: keep default.
avoid_bluetooth = true      # ignored on Linux; false allows the Bluetooth default
min_ms = 300                 # shorter taps are discarded without upload
auto_stop_secs = 0           # stop after N s of silence (0 = off)
keep_warm_secs = 0           # keep mic open N s (0 = off); macOS automatic echo cancellation always closes
ignore_speakers = false      # macOS: echo cancelling only when using the system default mic

[injection]
# Terminal control characters/multiline are copied for manual paste until
# bracketed-paste capability is verified. No automatic Enter/send-it support.
method = "paste"             # paste | type | clipboard
clipboard_only = false       # deprecated: use method = "clipboard"
restore_clipboard = true     # put your previous clipboard text back after pasting
restore_delay_ms = 300
trailing_space = true        # terminal mode strips trailing spaces/newlines and normalizes curly quotes/ellipsis
smart_spacing = true         # match spacing and capitalization to the text around the cursor (macOS; read locally, never uploaded)

[formatting]
# Spoken symbols too, in terminals and editors, between code-shaped words:
# "user underscore id" -> user_id, "dash dash verbose" -> --verbose, "a arrow b" -> a -> b.
# Everywhere, underscore and dash between IDs or names: "EBS underscore 321" -> EBS_321.
# Prose stays prose: "add a dash of salt", "plus one", "underscore the point".
spoken_code = true           # "camel case user id" -> userId; "main dot rs" -> main.rs
# Snapping runs before dictionary.replacements, so a replacement's `from` must
# match the snapped spelling ("xflow", not "x flow", when xflow is saved).
# Dictionary phrases protect overlapping cue words: "Google Cloud" blocks cloud,
# and "VS Code" blocks cloud code, even outside those dictionary phrases.
snap_to_dictionary = true    # restore user spellings and context-gated dev terms; false disables both
remove_fillers = true
fillers = ["um", "umm", "uh", "uhm", "er", "erm", "ah", "hmm", "mm", "mhm"]
spoken_punctuation = false   # "comma", "period", "new line", ... become punctuation
lists = true                 # "one ..., two ..., three ..." / "bullet ..." become a list (never in terminals)

[dictionary]
words = []                   # e.g. ["Postgres", "Kubernetes", "xflow"]
replacements = []            # e.g. [{ from = "postgress", to = "Postgres" }]
auto_learn = true            # learn words you correct after dictating (macOS) or in history
learned = []                 # learned words; `xflow dictionary remove WORD` blocks relearning; `xflow dictionary undo` reverts the latest automatic save
never_learn = []             # removed learned words, never learned again

[vocab]
# Shipped term packs, applied locally after transcription with snap_to_dictionary.
# Words that are also everyday English change only next to a context word:
# "cloud storage" stays, "ask cloud to review" becomes "ask Claude to review".
# Your dictionary words and never_learn always win. With stt.domain_hints the
# same packs are also recognition hints: public product and industry terms, not your data.
dev = true                   # developer and AI terms everywhere (always on in terminals and editors)
corp = true                  # business and SaaS terms: OKR, SOC 2, Salesforce, Jira
sheet = false                # spreadsheet functions everywhere (always on in Excel, Numbers, LibreOffice Calc)
finance = false              # banking and accounting terms: EBITDA, GAAP, IBAN, KYC

[sounds]
enabled = true
volume = 0.5
# start = "/path/to/start.wav"
# stop = "/path/to/stop.wav"
# error = "/path/to/error.wav"

[notifications]
enabled = false              # desktop notifications for errors and clipboard-only results

[privacy]
history = true
history_limit = 500
offline = false              # reject remote endpoints (local engines only)
keep_failed_audio = false    # keep a failed dictation's audio (one, private, 24 h) for `xflow retry`
window_terms = false         # opt in (macOS for now): spell file/project/branch names from editor and terminal window titles (read locally, never uploaded)

[ui]
theme = "paper"              # TUI theme; see `xflow tui` → Settings
mouse = true

# Voice snippets: say the trigger, get the text.
# [[snippets]]
# trigger = "my email"
# text = "me@example.com"

# Per-app styles: the first style whose apps match the focused app id wins.
# [[styles]]
# name = "chat"
# apps = ["slack", "discord", "telegram"]
# mode = "light"
# prompt = "Casual tone. Lowercase is fine."

# Ask before turning on Xflow for a recognized meeting (macOS 14.2+).
# Detection opens no microphone. Set false to disable prompts.
[meetings]
detect = true
